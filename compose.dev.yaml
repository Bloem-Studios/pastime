name: pastime-dev
services:
  postgres:
    image: postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_USER: pastime
      POSTGRES_DB: pastime_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a private development .env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-18543}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    mem_limit: 512m
    cpus: 2
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pastime -d pastime_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
  valkey:
    image: valkey/valkey@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
    command: [valkey-server, --save, "", --appendonly, "no", --maxmemory, 64mb, --maxmemory-policy, allkeys-lru]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-18679}:6379"
    mem_limit: 128m
    cpus: 1
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
