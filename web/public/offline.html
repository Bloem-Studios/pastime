<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · Pastime</title>
  <style>
    html { color-scheme: dark; background: #101416; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: system-ui, sans-serif; color: #e8e8ec; }
    main { max-width: 420px; padding: 32px; text-align: center; }
    h1 { font-size: 28px; letter-spacing: -.02em; margin: 0 0 12px; }
    p { color: #9696a0; line-height: 1.6; margin: 0 0 24px; }
    a { display: inline-block; padding: 12px 22px; border-radius: 999px; background: #00d8ac; color: #101416; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>You’re offline.</h1>
    <p>Pastime needs a connection to your server. Your library is safe; try again when you are back online.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
